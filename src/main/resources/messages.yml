# ---------- Topic help ----------
help-topic-unknown: "%prefix%&cUnknown topic. &7%topics%"
help-topic-header: "&8&m-----&r &cHelp: &f%topic% &8&m-----"
help-topic-footer: "&8Page &f%page%&8/&f%pages%"
help-page-prev: "&b[<]"
help-page-next: "&b[>]"
help-no-permission-topic: "%prefix%&cThat topic is not for you."
usage-help-suffix:
  text: "  &b[HELP]"
  hover: "&7Short guide for &f%topic%"
  click: RUN_COMMAND
  value: "/murder help %topic%"

topics:
  setup:
    - "&7The wizard walks an arena from empty to ready."
    - "&f/murder setup start <arena> &8- &7begin"
    - "&f/murder setup here &8- &7finish the current step where you stand"
    - "&f/murder setup status &8- &7full checklist"
    - "&7Every step can also be done by hand - the wizard reads the"
    - "&7real state from arenas.yml, so nothing gets out of sync."
  arena:
    - "&f/murder create <arena> &8- &7create an empty arena"
    - "&f/murder delete <arena> confirm &8- &7delete it"
    - "&f/murder clone <from> <to> &8- &7copy spawns, zones and settings"
    - "&f/murder enable|disable <arena> &8- &7toggle the arena"
    - "&f/murder info <arena> &8- &7checklist of what is missing"
  spawns:
    - "&7You need at least as many player spawns as maxplayers,"
    - "&7otherwise the plugin rotates through them."
    - "&f/murder setspawn <arena> &8- &7add a spawn at your position"
    - "&f/murder delspawn <arena> <nr> &8- &7remove one"
    - "&f/murder setspectator <arena> &8- &7spawn for dead players"
    - "&f/murder setgold <arena> &8- &720-40 spread over the map"
  zones:
    - "&7Select with the wand: left click = pos1, right click = pos2."
    - "&f/murder wand &8- &7get the selection axe"
    - "&f/murder setbounds <arena> &8- &7selection becomes the arena border"
    - "&f/murder zone add <arena> <name> <type>"
    - "&7Types: &fINSTANT&7, &fDAMAGE&7, &fPUSHBACK&7, &fBORDER&7, &fNO_BUILD&7, &fSAFE"
    - "&7A death inside a zone has no killer - if the murderer drowns,"
    - "&7the innocents win normally."
  npc:
    - "&f/murder npc create <type> [arena] &8- &7create at your position"
    - "&f/murder npc setskin <id> <player> &8- &7take a skin"
    - "&f/murder npc sethologram <id> <line> <text>"
    - "&7Types: JOIN, RANDOM, VOTE, SHOP, STATS, LEADERBOARD,"
    - "&7SPECTATE, LEAVE, INFO, REPLAY, KALI, POTION"
    - "&f/murder hooks &8- &7which NPC plugin is being used"
  kali:
    - "&7Sacrifice items at the altar to raise your favor,"
    - "&7then pray with an empty hand: high favor means a blessing,"
    - "&7low favor means a curse."
    - "&f/murder setaltar <arena> &8- &7look at a block and set it"
    - "&f/murder kali chances &8- &7all chances with a sum check"
    - "&f/murder kali favor <player> [n] &8- &7read or set the favor"
  potions:
    - "&7Brewing stations sell an unknown potion for 1 gold."
    - "&7Same color means same effect - but only for this round."
    - "&f/murder setpotion <arena> &8- &7add a station"
    - "&f/murder potions <arena> &8- &7show all stations"
  gold:
    - "&7Gold lies at fixed spawn points and respawns every"
    - "&7%seconds% seconds. It is picked up by walking into it."
    - "&7At &f%needed% &7gold a player automatically receives a bow."
    - "&7The murderer collects gold too - but never gets a bow."
  blocked:
    - "&7Players inside an arena cannot use commands that would"
    - "&7break the round or reveal roles."
    - "&7Modes: &fBLACKLIST &7(default) and &fWHITELIST&7."
    - "&7always-allowed applies in both modes, so nobody can lock"
    - "&7themselves out of their own game."
  scoreboard:
    - "&7Everything lives in scoreboard.yml: sidebar, bossbar,"
    - "&7actionbar and tablist - per game state and per role."
    - "&f/murder scoreboard &8- &7toggle the sidebar for yourself"
    - "&7inherit: <state> avoids copy-paste between states."
  replay:
    - "&7Needs AdvancedReplay. Without it the branch stays silent."
    - "&f/murder replay last &8- &7watch your last round"
    - "&f/murder replay list &8- &7your recordings"
    - "&7Replays are never available during a running round -"
    - "&7they would reveal the murderer."
  nametags:
    - "&7During a round no names are shown above the heads."
    - "&7Anyone who can read names identifies friends across the"
    - "&7whole map and the guessing game falls apart."
    - "&7Optionally names can also be hidden in chat and tablist"
    - "&7(nametags.hide-in-chat / hide-in-tablist)."
  config:
    - "&f/murder reload [file] &8- &7reload everything or one file"
    - "&f/murder config get <path> &8- &7read a value"
    - "&f/murder config set <path> <value> &8- &7change and save it"
    - "&7Every option can be overridden per arena via the"
    - "&7overrides section in arenas.yml."

