setup-step-1-title: "GLOBAL LOBBY"
setup-step-1-text: "Where players stand before they join a game."
setup-step-1-hint: "/murder setlobby"
setup-step-2-title: "EXIT POINT"
setup-step-2-text: "Where players are sent after a round or on leave."
setup-step-2-hint: "/murder setexit"
setup-step-3-title: "ARENA"
setup-step-3-text: "The arena entry itself - already created."
setup-step-3-hint: "/murder create <arena>"
setup-step-4-title: "ARENA BOUNDS"
setup-step-4-text: "Select the map with the wand, then confirm the selection."
setup-step-4-hint: "/murder wand, then /murder setbounds %arena%"
setup-step-5-title: "PLAYER SPAWNS"
setup-step-5-text: "Where players spawn when the round starts. Spread them over the whole map."
setup-step-5-hint: "/murder setspawn %arena%"
setup-step-6-title: "SPECTATOR SPAWN"
setup-step-6-text: "Where dead players and spectators are put."
setup-step-6-hint: "/murder setspectator %arena%"
setup-step-7-title: "GOLD SPAWNS"
setup-step-7-text: "Gold appears here every %seconds% seconds. Avoid dead ends."
setup-step-7-hint: "/murder setgold %arena%"
setup-step-8-title: "DEATH ZONES"
setup-step-8-text: "Optional: mark water, pits or off-limit areas with the wand."
setup-step-8-hint: "/murder zone add %arena% <name> INSTANT"
setup-step-9-title: "KALI ALTAR"
setup-step-9-text: "Optional: look at a block and set it as the altar."
setup-step-9-hint: "/murder setaltar %arena%"
setup-step-10-title: "BREWING STATIONS"
setup-step-10-text: "Optional: stations for the mystery potion."
setup-step-10-hint: "/murder setpotion %arena%"
setup-step-11-title: "SETTINGS"
setup-step-11-text: "Optional: player counts and round time. The defaults are fine."
setup-step-11-hint: "/murder set %arena% maxplayers 16"
setup-step-12-title: "JOIN NPC"
setup-step-12-text: "Optional: a figure in the lobby that players click to join."
setup-step-12-hint: "/murder npc create JOIN %arena%"

