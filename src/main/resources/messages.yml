join-cooldown: "%prefix%&cSlow down - try again in &f%seconds%s&c."

help-header: "&8&m--------&r &cMurder Mystery &8&m--------"
help-player:
  - "&c/murder join &8- &7Join a game"
  - "&c/murder leave &8- &7Leave the game"
  - "&c/murder role &8- &7Show your own role"
  - "&c/murder shop &8- &7Cosmetics"
  - "&c/murder stats &8- &7Your statistics"
  - "&c/murder list &8- &7Show all arenas"
  - "&c/murder vote <map> &8- &7Vote for a map"
  - "&c/murder spectate <arena> &8- &7Watch a running round"
help-admin:
  - "&c/murder start|stop &8- &7Control the round"
  - "&c/murder create|delete <arena> &8- &7Manage arenas"
  - "&c/murder setup start <arena> &8- &7Guided setup wizard"
  - "&c/murder setlobby|setexit &8- &7Global points"
  - "&c/murder setspawn|setgold|setspectator <arena> &8- &7Set points"
  - "&c/murder wand|setbounds|zone &8- &7Regions & death zones"
  - "&c/murder set <arena> <option> <value> &8- &7Arena settings"
  - "&c/murder npc &8- &7Manage lobby NPCs"
  - "&c/murder info <arena> &8- &7Check the setup"
