# ============================================================
#  MurderMystery - all texts
#  Author : LucasTHCR
#  Support: dc.gg/paperstream
#
#  Colors with &, hex with &#RRGGBB. Placeholders in %percent%.
#  An empty string means the message is not sent at all.
#
#  A line may also be an object to make it clickable:
#    some-key:
#      text: "&a[CLICK ME]"
#      hover: "&7Explanation"
#      click: RUN_COMMAND        # RUN_COMMAND | SUGGEST_COMMAND | OPEN_URL | COPY_TO_CLIPBOARD
#      value: "/murder setup here"
# ============================================================
config-version: 1

prefix: "&8[&cMurder&8] &7"

# ---------- General ----------
