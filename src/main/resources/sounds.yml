# ============================================================
#  MurderMystery - one sound per event
#  Author: LucasTHCR  |  dc.gg/paperstream
#
#  enabled: false turns a single sound off without removing it.
#  Sound names use the Bukkit enum style (ENTITY_PLAYER_LEVELUP)
#  or the namespaced key (minecraft:entity.player.levelup).
# ============================================================
config-version: 1

gold-pickup:      {enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.6, pitch: 1.6}
bow-received:     {enabled: true, sound: ENTITY_PLAYER_LEVELUP,        volume: 1.0, pitch: 1.2}
bow-dropped:      {enabled: true, sound: ITEM_TRIDENT_HIT_GROUND,      volume: 1.0, pitch: 1.0}
arrow-ready:      {enabled: true, sound: BLOCK_NOTE_BLOCK_PLING,       volume: 0.8, pitch: 2.0}
knife-throw:      {enabled: true, sound: ENTITY_ARROW_SHOOT,           volume: 1.0, pitch: 1.4}
knife-return:     {enabled: true, sound: ITEM_TRIDENT_RETURN,          volume: 0.8, pitch: 1.2}
kill:             {enabled: true, sound: ENTITY_PLAYER_HURT,           volume: 1.0, pitch: 1.0}
murderer-killed:  {enabled: true, sound: ENTITY_ENDER_DRAGON_GROWL,    volume: 0.5, pitch: 1.4}
death-self:       {enabled: true, sound: ENTITY_WITHER_SPAWN,          volume: 0.4, pitch: 1.0}
countdown-tick:   {enabled: true, sound: BLOCK_NOTE_BLOCK_HAT,         volume: 1.0, pitch: 1.0}
countdown-final:  {enabled: true, sound: BLOCK_NOTE_BLOCK_PLING,       volume: 1.0, pitch: 2.0}
game-start:       {enabled: true, sound: ENTITY_ENDER_DRAGON_FLAP,     volume: 1.0, pitch: 1.0}
win:              {enabled: true, sound: UI_TOAST_CHALLENGE_COMPLETE,  volume: 1.0, pitch: 1.0}
lose:             {enabled: true, sound: ENTITY_VILLAGER_NO,           volume: 1.0, pitch: 1.0}
command-blocked:  {enabled: true, sound: BLOCK_NOTE_BLOCK_BASS,        volume: 1.0, pitch: 0.5}
npc-click:        {enabled: true, sound: UI_BUTTON_CLICK,              volume: 1.0, pitch: 1.0}
zone-warning:     {enabled: true, sound: BLOCK_NOTE_BLOCK_DIDGERIDOO,  volume: 1.0, pitch: 0.7}
shop-buy:         {enabled: true, sound: ENTITY_VILLAGER_YES,          volume: 1.0, pitch: 1.0}
shop-fail:        {enabled: true, sound: ENTITY_VILLAGER_NO,           volume: 1.0, pitch: 1.0}
menu-click:       {enabled: true, sound: UI_BUTTON_CLICK,              volume: 0.6, pitch: 1.2}
join:             {enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.8, pitch: 1.0}
leave:            {enabled: true, sound: BLOCK_NOTE_BLOCK_BASS,        volume: 0.8, pitch: 0.8}
setup-step:       {enabled: true, sound: BLOCK_NOTE_BLOCK_PLING,       volume: 0.7, pitch: 1.6}
kali-pray:        {enabled: true, sound: BLOCK_NOTE_BLOCK_HAT,         volume: 1.0, pitch: 1.0}
kali-blessing:    {enabled: true, sound: ENTITY_PLAYER_LEVELUP,        volume: 1.0, pitch: 1.0}
kali-curse:       {enabled: true, sound: ENTITY_WITHER_SPAWN,          volume: 0.6, pitch: 1.0}
kali-gift:        {enabled: true, sound: BLOCK_AMETHYST_BLOCK_CHIME,   volume: 1.0, pitch: 1.0}
potion-buy:       {enabled: true, sound: BLOCK_BREWING_STAND_BREW,     volume: 1.0, pitch: 1.0}
potion-reveal:    {enabled: true, sound: BLOCK_ENCHANTMENT_TABLE_USE,  volume: 1.0, pitch: 1.2}
levelup:          {enabled: true, sound: UI_TOAST_CHALLENGE_COMPLETE,  volume: 1.0, pitch: 1.4}
